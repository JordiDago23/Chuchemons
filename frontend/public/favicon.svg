<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#000" stroke-width="2"/>
  
  <!-- Red top half -->
  <path d="M 2 32 A 30 30 0 0 1 62 32 Z" fill="#ff1744" stroke="#000" stroke-width="2"/>
  
  <!-- White bottom half -->
  <path d="M 2 32 A 30 30 0 0 0 62 32 Z" fill="#ffffff" stroke="#000" stroke-width="2"/>
  
  <!-- Dividing line -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#000" stroke-width="2"/>
  
  <!-- Center button outer circle -->
  <circle cx="32" cy="32" r="10" fill="#ffffff" stroke="#000" stroke-width="2"/>
  
  <!-- Center button inner circle -->
  <circle cx="32" cy="32" r="6" fill="#cccccc" stroke="#000" stroke-width="1.5"/>
  
  <!-- Center button highlight -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
